# Deploys the cloud save API (worker/) to Cloudflare and tells the game where to find it.
# Needs these repo settings (Settings → Secrets and variables → Actions) — see CLOUD-SETUP.md:
#   Secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
#   Variables: GOOGLE_CLIENT_ID
name: Deploy cloud save API

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/deploy-api.yml"]
  workflow_dispatch:

permissions:
  contents: write   # to commit js/cloud-config.js with the API address

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      API_URL_OVERRIDE: ${{ vars.API_URL }}
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4

      - name: Check setup
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::Cloud saves aren't set up yet. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (see CLOUD-SETUP.md), then re-run this workflow."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
          if [ -z "$GOOGLE_CLIENT_ID" ]; then echo "::warning::GOOGLE_CLIENT_ID variable is missing, so only account codes will work until it's added."; fi

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 20

      - name: Install
        if: env.SKIP != '1'
        run: npm ci --no-audit --no-fund

      - name: Create the database (first run only)
        if: env.SKIP != '1'
        run: |
          find_id() { npx wrangler d1 list --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const a=JSON.parse(s);const d=a.find(x=>x.name==="lumenbeasts");console.log(d?(d.uuid||d.id):"")})'; }
          ID=$(find_id)
          if [ -z "$ID" ]; then npx wrangler d1 create lumenbeasts; ID=$(find_id); fi
          if [ -z "$ID" ]; then echo "::error::Couldn't find or create the D1 database. Check the API token has D1 Edit permission."; exit 1; fi
          sed -i "s/^database_id = .*/database_id = \"$ID\"/" wrangler.toml
          echo "Database: $ID"

      - name: Update database tables
        if: env.SKIP != '1'
        run: npx wrangler d1 migrations apply lumenbeasts --remote

      - name: Deploy the API
        if: env.SKIP != '1'
        run: |
          npx wrangler deploy --var "GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}" 2>&1 | tee deploy.log
          URL="${API_URL_OVERRIDE:-$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)}"
          if [ -z "$URL" ]; then echo "::error::Deployed, but couldn't find the workers.dev address. Open Workers & Pages in Cloudflare and make sure a workers.dev subdomain is set up."; exit 1; fi
          echo "API_URL=$URL" >> "$GITHUB_ENV"
          echo "### Cloud save API is live at $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Point the game at the API
        if: env.SKIP != '1'
        working-directory: .
        run: |
          cat > js/cloud-config.js <<EOF
          /* Written automatically by .github/workflows/deploy-api.yml. Don't edit by hand. */
          window.CLOUD_CONFIG = { api: "${API_URL}", googleClientId: "${GOOGLE_CLIENT_ID}" };
          EOF
          if git diff --quiet -- js/cloud-config.js; then echo "Game already points at the API."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add js/cloud-config.js
          git commit -m "Point the game at the cloud save API"
          git push
