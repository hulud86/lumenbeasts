# Lumen Beasts cloud save API (Cloudflare Worker + D1)
# Deployed automatically by .github/workflows/deploy-api.yml — see CLOUD-SETUP.md
name = "lumenbeasts-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
# Sites allowed to call the API (comma separated). Add your domain here when you buy it.
ALLOWED_ORIGINS = "https://hulud86.github.io,https://lumenbeasts.com,https://www.lumenbeasts.com,http://localhost:8000,http://127.0.0.1:8000"
# GOOGLE_CLIENT_ID is passed in at deploy time from the repo variable of the same name.

[[d1_databases]]
binding = "DB"
database_name = "lumenbeasts"
database_id = "00000000-0000-0000-0000-000000000000"   # filled in by the deploy workflow
migrations_dir = "migrations"
