<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumen Beasts — Collect the beasts of the shattered moon</title>
<meta name="description" content="Lumen Beasts: open a free Shard Pack every day and collect 100 original creatures born from the shattered moon.">
<meta name="theme-color" content="#0b0d1f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 L25 13 L19 30 L13 30 L7 13Z' fill='%23ffc94a' stroke='%237ef0ff' stroke-width='2'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="sky" aria-hidden="true"><div class="aurora"></div><div class="stars"></div></div>

<header class="topbar">
  <a class="logo" href="#home" aria-label="Lumen Beasts home">
    <svg viewBox="0 0 32 32" class="logo-mark" aria-hidden="true"><path d="M16 2 L25 13 L19 30 L13 30 L7 13Z" fill="url(#lg)" stroke="#7ef0ff" stroke-width="1.5"/><path d="M16 2 L16 30 M7 13 L16 17 L25 13" stroke="#fff" stroke-width=".8" opacity=".6" fill="none"/><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff2c4"/><stop offset="1" stop-color="#ff9a3d"/></linearGradient></defs></svg>
    <span class="logo-word" id="logoWord">Lumen Beasts</span>
  </a>
  <nav class="mainnav" id="mainnav"></nav>
  <div class="top-right">
    <button class="pill pill-packs" id="pillPacks" title="Packs ready"><span class="pill-ico">✦</span><b id="pillPackCount">0</b><span class="hide-sm">packs</span></button>
    <span class="pill pill-dust" title="Shard Dust"><span class="dust-ico"></span><b id="pillDust">0</b></span>
    <button class="icon-btn" id="btnSettings" aria-label="Settings"><svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.5.1-1-.1-1 2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.6a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.5 11l-.1 1 .1 1-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.4-2.6c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5Z"/></svg></button>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<nav class="tabbar" id="tabbar"></nav>

<div class="modal" id="modal" hidden><div class="modal-backdrop" data-close></div><div class="modal-box" role="dialog" aria-modal="true"><button class="modal-x" data-close aria-label="Close">✕</button><div id="modalBody"></div></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="fx-layer" id="fx" aria-hidden="true"></div>

<script src="js/config.js"></script>
<script src="js/creatures.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
</body>
</html>
