<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3352"/><stop offset=".7" stop-color="#6a6a7a"/><stop offset="1" stop-color="#2a2a32"/></linearGradient>
<linearGradient id="steel" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a6270"/><stop offset=".4" stop-color="#d8dee8"/><stop offset=".6" stop-color="#9aa2b0"/><stop offset="1" stop-color="#3a404a"/></linearGradient>
