<feFlood flood-color="#7ef0ff" flood-opacity=".55"/><feComposite in2="b" operator="in" result="glow"/>
<feFlood flood-color="#060818"/><feComposite in2="SourceAlpha" operator="in" result="body"/>
<feMerge><feMergeNode in="glow"/><feMergeNode in="body"/></feMerge></filter>
</defs>
